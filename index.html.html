<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎵 Song Word Game</title>
    <meta name="description" content="A fun party game - sing a song containing the random word before time runs out!">
    <meta name="theme-color" content="#4c1d95">
    
    <!-- Open Graph for sharing -->
    <meta property="og:title" content="Song Word Game">
    <meta property="og:description" content="A fun party game - sing a song with the word!">
    <meta property="og:type" content="website">
    
    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { overscroll-behavior: none; }
        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(236, 72, 153, 0.5); }
            50% { text-shadow: 0 0 40px rgba(236, 72, 153, 0.8), 0 0 60px rgba(139, 92, 246, 0.6); }
        }
        .word-glow { animation: pulse-glow 2s ease-in-out infinite; }
        @keyframes bounce-in {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        .bounce-in { animation: bounce-in 0.5s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // ============================================================
        // 🎯 EASY TO EDIT SECTION - MODIFY THESE VALUES!
        // ============================================================

        // ADD OR REMOVE WORDS HERE - these are words players need to sing!
        const SONG_WORDS = [
            // 💕 Emotions & Feelings
            "love", "heart", "dream", "fire", "rain", "sunshine", "midnight", "forever",
            "crazy", "beautiful", "lonely", "happy", "sad", "free", "wild", "sweet",
            "alive", "broken", "strong", "young", "lost", "found", "high", "low",
            
            // 🏃 Actions
            "dance", "sing", "fly", "run", "cry", "smile", "kiss", "hold", "believe",
            "remember", "forget", "fall", "rise", "shine", "burn", "break", "stay",
            "wait", "walk", "jump", "touch", "feel", "breathe", "fight", "survive",
            
            // 🌙 Nature & Time
            "moon", "star", "sky", "ocean", "river", "mountain", "summer", "winter",
            "night", "day", "morning", "yesterday", "tomorrow", "tonight", "sunrise",
            "sunset", "storm", "wind", "flower", "rain", "snow", "spring", "autumn",
            
            // 👫 Relationships & People
            "baby", "honey", "angel", "devil", "friend", "stranger", "lover", "hero",
            "girl", "boy", "man", "woman", "mother", "father", "child", "king", "queen",
            
            // 🏠 Places & Things
            "home", "road", "city", "world", "heaven", "paradise", "diamond", "gold",
            "door", "window", "bridge", "street", "car", "train", "plane", "bed",
            
            // ✨ Abstract & Musical
            "time", "life", "soul", "magic", "destiny", "truth", "hope", "faith",
            "glory", "power", "music", "rhythm", "melody", "thunder", "lightning",
            "money", "party", "game", "story", "secret", "promise", "chance", "change"
        ];

        // DIFFICULTY SETTINGS - Change the time (in seconds) for each level
        const DIFFICULTY_SETTINGS = {
            easy:   { time: 30, label: "Easy (30s)",   color: "from-green-500 to-emerald-500" },
            medium: { time: 20, label: "Medium (20s)", color: "from-yellow-500 to-orange-500" },
            hard:   { time: 10, label: "Hard (10s)",   color: "from-red-500 to-pink-500" }
        };

        // GAME TITLE - Change the name of your game!
        const GAME_TITLE = "🎵 Song Word";
        const GAME_SUBTITLE = "Sing a song with the word!";

        // ============================================================
        // 🎮 GAME LOGIC - (More advanced editing below)
        // ============================================================

        function SongWordGame() {
            const [gameState, setGameState] = useState('menu');
            const [currentWord, setCurrentWord] = useState('');
            const [timeLeft, setTimeLeft] = useState(20);
            const [difficulty, setDifficulty] = useState('medium');
            const [score, setScore] = useState({ correct: 0, rounds: 0 });
            const [usedWords, setUsedWords] = useState(new Set());
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [showBounce, setShowBounce] = useState(false);
            const timerRef = useRef(null);

            // Text-to-speech
            const speakWord = useCallback((word) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(word);
                    utterance.rate = 0.8;
                    utterance.pitch = 1;
                    utterance.volume = 1;
                    utterance.onstart = () => setIsSpeaking(true);
                    utterance.onend = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }
            }, []);

            // Get random word
            const getNewWord = useCallback(() => {
                let availableWords = SONG_WORDS.filter(w => !usedWords.has(w));
                if (availableWords.length === 0) {
                    setUsedWords(new Set());
                    availableWords = SONG_WORDS;
                }
                const word = availableWords[Math.floor(Math.random() * availableWords.length)];
                setUsedWords(prev => new Set([...prev, word]));
                return word;
            }, [usedWords]);

            // Start round
            const startRound = useCallback(() => {
                const word = getNewWord();
                setCurrentWord(word);
                setTimeLeft(DIFFICULTY_SETTINGS[difficulty].time);
                setGameState('playing');
                setShowBounce(true);
                setTimeout(() => setShowBounce(false), 600);
                setTimeout(() => speakWord(word), 500);
            }, [difficulty, getNewWord, speakWord]);

            // Timer
            useEffect(() => {
                if (gameState === 'playing' && timeLeft > 0) {
                    timerRef.current = setTimeout(() => setTimeLeft(t => t - 1), 1000);
                } else if (gameState === 'playing' && timeLeft === 0) {
                    setGameState('timesup');
                    setScore(s => ({ ...s, rounds: s.rounds + 1 }));
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance("Time's up!");
                        utterance.rate = 1.2;
                        window.speechSynthesis.speak(utterance);
                    }
                }
                return () => clearTimeout(timerRef.current);
            }, [gameState, timeLeft]);

            const handleCorrect = () => {
                setScore(s => ({ correct: s.correct + 1, rounds: s.rounds + 1 }));
                startRound();
            };

            const handleSkip = () => {
                setScore(s => ({ ...s, rounds: s.rounds + 1 }));
                startRound();
            };

            const openSpotifySearch = () => {
                const query = encodeURIComponent(currentWord);
                window.open(`https://open.spotify.com/search/${query}`, '_blank');
            };

            const resetGame = () => {
                setGameState('menu');
                setScore({ correct: 0, rounds: 0 });
                setUsedWords(new Set());
                setCurrentWord('');
            };

            const getTimerColor = () => {
                const pct = timeLeft / DIFFICULTY_SETTINGS[difficulty].time;
                if (pct > 0.5) return 'text-green-400';
                if (pct > 0.25) return 'text-yellow-400';
                return 'text-red-400';
            };

            const timerProgress = (timeLeft / DIFFICULTY_SETTINGS[difficulty].time) * 100;

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 flex items-center justify-center p-4">
                    <div className="w-full max-w-md">
                        
                        {/* MENU */}
                        {gameState === 'menu' && (
                            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 text-center shadow-2xl border border-white/20">
                                <div className="mb-8">
                                    <h1 className="text-4xl font-bold text-white mb-2">{GAME_TITLE}</h1>
                                    <p className="text-purple-200">{GAME_SUBTITLE}</p>
                                </div>
                                
                                <div className="mb-8">
                                    <h2 className="text-white text-lg mb-4">Select Difficulty</h2>
                                    <div className="flex flex-col sm:flex-row gap-2 justify-center">
                                        {Object.entries(DIFFICULTY_SETTINGS).map(([key, { label, color }]) => (
                                            <button
                                                key={key}
                                                onClick={() => setDifficulty(key)}
                                                className={`px-4 py-3 rounded-xl font-medium transition-all ${
                                                    difficulty === key
                                                        ? `bg-gradient-to-r ${color} text-white shadow-lg scale-105`
                                                        : 'bg-white/20 text-white hover:bg-white/30'
                                                }`}
                                            >
                                                {label}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                
                                <button
                                    onClick={startRound}
                                    className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white text-xl font-bold py-4 px-8 rounded-2xl hover:from-pink-600 hover:to-purple-600 transition-all transform hover:scale-105 shadow-lg active:scale-95"
                                >
                                    🎤 Start Game
                                </button>
                                
                                <div className="mt-8 text-purple-200 text-sm bg-white/5 rounded-2xl p-4">
                                    <h3 className="font-semibold mb-3 text-white">How to Play:</h3>
                                    <ol className="text-left space-y-2">
                                        <li className="flex items-start gap-2">
                                            <span className="bg-purple-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs flex-shrink-0 mt-0.5">1</span>
                                            <span>A word will appear and be spoken aloud</span>
                                        </li>
                                        <li className="flex items-start gap-2">
                                            <span className="bg-purple-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs flex-shrink-0 mt-0.5">2</span>
                                            <span>Sing any song containing that word!</span>
                                        </li>
                                        <li className="flex items-start gap-2">
                                            <span className="bg-purple-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs flex-shrink-0 mt-0.5">3</span>
                                            <span>Other players judge if you got it right</span>
                                        </li>
                                        <li className="flex items-start gap-2">
                                            <span className="bg-purple-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs flex-shrink-0 mt-0.5">4</span>
                                            <span>Beat the timer to score points!</span>
                                        </li>
                                    </ol>
                                </div>

                                <p className="mt-4 text-purple-300/60 text-xs">
                                    {SONG_WORDS.length} words available
                                </p>
                            </div>
                        )}

                        {/* PLAYING */}
                        {gameState === 'playing' && (
                            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 text-center shadow-2xl border border-white/20">
                                {/* Timer Circle */}
                                <div className="relative w-48 h-48 mx-auto mb-6">
                                    <svg className="w-full h-full transform -rotate-90">
                                        <circle cx="96" cy="96" r="88" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="12" />
                                        <circle
                                            cx="96" cy="96" r="88" fill="none"
                                            stroke="url(#timerGradient)" strokeWidth="12" strokeLinecap="round"
                                            strokeDasharray={553}
                                            strokeDashoffset={553 - (timerProgress / 100) * 553}
                                            className="transition-all duration-1000 ease-linear"
                                        />
                                        <defs>
                                            <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                                <stop offset="0%" stopColor="#ec4899" />
                                                <stop offset="100%" stopColor="#8b5cf6" />
                                            </linearGradient>
                                        </defs>
                                    </svg>
                                    <div className="absolute inset-0 flex items-center justify-center">
                                        <span className={`text-6xl font-bold transition-colors ${getTimerColor()}`}>
                                            {timeLeft}
                                        </span>
                                    </div>
                                </div>

                                {/* Word Display */}
                                <div className="mb-8">
                                    <p className="text-purple-200 text-lg mb-2">Sing a song with:</p>
                                    <h2 className={`text-5xl font-bold text-white mb-4 ${showBounce ? 'bounce-in' : ''} ${isSpeaking ? 'word-glow' : ''}`}>
                                        "{currentWord}"
                                    </h2>
                                    <button
                                        onClick={() => speakWord(currentWord)}
                                        className="text-purple-300 hover:text-white transition-colors text-lg"
                                    >
                                        🔊 Hear again
                                    </button>
                                </div>

                                {/* Buttons */}
                                <div className="flex gap-4">
                                    <button
                                        onClick={handleSkip}
                                        className="flex-1 bg-gradient-to-r from-red-500 to-orange-500 text-white py-4 px-6 rounded-2xl font-bold hover:from-red-600 hover:to-orange-600 transition-all active:scale-95 shadow-lg"
                                    >
                                        ⏭️ Skip
                                    </button>
                                    <button
                                        onClick={handleCorrect}
                                        className="flex-1 bg-gradient-to-r from-green-500 to-emerald-500 text-white py-4 px-6 rounded-2xl font-bold hover:from-green-600 hover:to-emerald-600 transition-all active:scale-95 shadow-lg"
                                    >
                                        ✅ Got It!
                                    </button>
                                </div>

                                <div className="mt-6 text-purple-200 text-lg">
                                    Score: <span className="font-bold text-white">{score.correct}</span> / {score.rounds}
                                </div>
                            </div>
                        )}

                        {/* TIME'S UP */}
                        {gameState === 'timesup' && (
                            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 text-center shadow-2xl border border-white/20">
                                <div className="text-6xl mb-4 bounce-in">⏰</div>
                                <h2 className="text-3xl font-bold text-white mb-2">Time's Up!</h2>
                                <p className="text-purple-200 mb-2">The word was:</p>
                                <h3 className="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400 mb-8">
                                    "{currentWord}"
                                </h3>

                                <div className="space-y-3">
                                    <button
                                        onClick={openSpotifySearch}
                                        className="w-full bg-[#1DB954] text-white py-4 px-6 rounded-2xl font-bold hover:bg-[#1ed760] transition-all flex items-center justify-center gap-3 active:scale-95"
                                    >
                                        <svg className="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                                        </svg>
                                        Find Songs on Spotify
                                    </button>

                                    <button
                                        onClick={startRound}
                                        className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 px-6 rounded-2xl font-bold hover:from-pink-600 hover:to-purple-600 transition-all active:scale-95"
                                    >
                                        🎵 Next Word
                                    </button>

                                    <button
                                        onClick={resetGame}
                                        className="w-full bg-white/20 text-white py-3 px-6 rounded-2xl font-medium hover:bg-white/30 transition-all active:scale-95"
                                    >
                                        🏠 Back to Menu
                                    </button>
                                </div>

                                <div className="mt-6 bg-white/10 rounded-xl p-4">
                                    <p className="text-purple-200 text-sm">Current Score</p>
                                    <p className="text-4xl font-bold text-white">
                                        {score.correct} <span className="text-purple-300 text-2xl">/ {score.rounds}</span>
                                    </p>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SongWordGame />);
    </script>
</body>
</html>
