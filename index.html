        // ============================================================
        // 🎮 GAME LOGIC - (More advanced editing below)
        // ============================================================

        function SongWordGame() {
            const [gameState, setGameState] = useState('menu');
            const [language, setLanguage] = useState(null); // null = language selection, 'en' or 'pt'
            const [currentWord, setCurrentWord] = useState('');
            const [timeLeft, setTimeLeft] = useState(20);
            const [difficulty, setDifficulty] = useState('medium');
            const [score, setScore] = useState({ correct: 0, rounds: 0 });
            const [usedWords, setUsedWords] = useState(new Set());
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [showBounce, setShowBounce] = useState(false);
            const timerRef = useRef(null);

            // Get current word list based on language
            const SONG_WORDS = language === 'pt' ? PORTUGUESE_WORDS : ENGLISH_WORDS;
            
            // Get UI text based on language
            const t = UI_TEXT[language] || UI_TEXT.en;

            // Text-to-speech with language support
            const speakWord = useCallback((word) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(word);
                    utterance.rate = 0.8;
                    utterance.pitch = 1;
                    utterance.volume = 1;
                    utterance.lang = language === 'pt' ? 'pt-BR' : 'en-US';
                    utterance.onstart = () => setIsSpeaking(true);
                    utterance.onend = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }
            }, [language]);

            // Get random word - now properly depends on language
            const getNewWord = useCallback(() => {
                const wordList = language === 'pt' ? PORTUGUESE_WORDS : ENGLISH_WORDS;
                let availableWords = wordList.filter(w => !usedWords.has(w));
                if (availableWords.length === 0) {
                    setUsedWords(new Set());
                    availableWords = wordList;
                }
                const word = availableWords[Math.floor(Math.random() * availableWords.length)];
                setUsedWords(prev => new Set([...prev, word]));
                return word;
            }, [usedWords, language]);

            // Clear used words when language changes to ensure fresh start with correct word list
            useEffect(() => {
                if (language !== null) {
                    setUsedWords(new Set());
                }
            }, [language]);

            // Start round - directly access language to avoid stale closure
            const startRound = useCallback(() => {
                // Get word list directly based on current language
                const wordList = language === 'pt' ? PORTUGUESE_WORDS : ENGLISH_WORDS;
                let availableWords = wordList.filter(w => !usedWords.has(w));
                if (availableWords.length === 0) {
                    setUsedWords(new Set());
                    availableWords = wordList;
                }
                const word = availableWords[Math.floor(Math.random() * availableWords.length)];
                setUsedWords(prev => new Set([...prev, word]));
                
                setCurrentWord(word);
                setTimeLeft(DIFFICULTY_SETTINGS[difficulty].time);
                setGameState('playing');
                setShowBounce(true);
                setTimeout(() => setShowBounce(false), 600);
                setTimeout(() => speakWord(word), 500);
            }, [difficulty, language, usedWords, speakWord]);

            // Timer
            useEffect(() => {
                if (gameState === 'playing' && timeLeft > 0) {
                    timerRef.current = setTimeout(() => setTimeLeft(t => t - 1), 1000);
                } else if (gameState === 'playing' && timeLeft === 0) {
                    setGameState('timesup');
                    setScore(s => ({ ...s, rounds: s.rounds + 1 }));
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(language === 'pt' ? "Tempo esgotado!" : "Time's up!");
                        utterance.rate = 1.2;
                        utterance.lang = language === 'pt' ? 'pt-BR' : 'en-US';
                        window.speechSynthesis.speak(utterance);
                    }
                }
                return () => clearTimeout(timerRef.current);
            }, [gameState, timeLeft]);

            const handleCorrect = () => {
                setScore(s => ({ correct: s.correct + 1, rounds: s.rounds + 1 }));
                startRound();
            };

            const handleSkip = () => {
                setScore(s => ({ ...s, rounds: s.rounds + 1 }));
                startRound();
            };

            const openSpotifySearch = () => {
                const query = encodeURIComponent(currentWord);
                // Filter to tracks only (not podcasts/audiobooks)
                window.open(`https://open.spotify.com/search/${query}/tracks`, '_blank');
            };

            // Search for lyrics - uses best lyrics site for each language
            const openLyricsSearch = () => {
                const query = encodeURIComponent(currentWord);
                if (language === 'pt') {
                    // Letras.mus.br is Brazil's most popular lyrics site
                    window.open(`https://www.letras.mus.br/?q=${query}`, '_blank');
                } else {
                    // Genius is great for English lyrics
                    window.open(`https://genius.com/search?q=${query}`, '_blank');
                }
            };

            const resetGame = () => {
                setGameState('menu');
                setScore({ correct: 0, rounds: 0 });
                setUsedWords(new Set());
                setCurrentWord('');
                setLanguage(null); // Go back to language selection
            };

            const getTimerColor = () => {
                const pct = timeLeft / DIFFICULTY_SETTINGS[difficulty].time;
                if (pct > 0.5) return 'text-green-400';
                if (pct > 0.25) return 'text-yellow-400';
                return 'text-red-400';
            };

            const timerProgress = (timeLeft / DIFFICULTY_SETTINGS[difficulty].time) * 100;

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 flex items-center justify-center p-4">
                    <div className="w-full max-w-md">
                        
                        {/* LANGUAGE SELECTION */}
                        {language === null && (
                            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 text-center shadow-2xl border border-white/20">
                                <div className="mb-8">
                                    <h1 className="text-4xl font-bold text-white mb-2">🎵 Song Word</h1>
                                    <h2 className="text-2xl font-bold text-white mb-1">🎵 Palavra Cantada</h2>
                                    <p className="text-purple-200 mt-4">Choose your language / Escolha seu idioma</p>
                                </div>
                                
                                <div className="space-y-4">
                                    <button
                                        onClick={() => setLanguage('en')}
                                        className="w-full bg-gradient-to-r from-blue-500 to-indigo-500 text-white text-xl font-bold py-5 px-8 rounded-2xl hover:from-blue-600 hover:to-indigo-600 transition-all transform hover:scale-105 shadow-lg active:scale-95 flex items-center justify-center gap-3"
                                    >
                                        <span className="text-3xl">🇺🇸</span>
                                        <span>English</span>
                                    </button>
                                    
                                    <button
                                        onClick={() => setLanguage('pt')}
                                        className="w-full bg-gradient-to-r from-green-500 to-yellow-500 text-white text-xl font-bold py-5 px-8 rounded-2xl hover:from-green-600 hover:to-yellow-600 transition-all transform hover:scale-105 shadow-lg active:scale-95 flex items-center justify-center gap-3"
                                    >
                                        <span className="text-3xl">🇧🇷</span>
                                        <span>Português Brasileiro</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* MENU */}
                        {language !== null && gameState === 'menu' && (
                            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 text-center shadow-2xl border border-white/20">
                                <div className="mb-8">
                                    <h1 className="text-4xl font-bold text-white mb-2">{t.gameTitle}</h1>
                                    <p className="text-purple-200">{t.gameSubtitle}</p>
                                </div>
                                
                                <div className="mb-8">
                                    <h2 className="text-white text-lg mb-4">{t.selectDifficulty}</h2>
                                    <div className="flex flex-col sm:flex-row gap-2 justify-center">
                                        {Object.entries(DIFFICULTY_SETTINGS).map(([key, { label, color }]) => (
                                            <button
                                                key={key}
                                                onClick={() => setDifficulty(key)}
                                                className={`px-4 py-3 rounded-xl font-medium transition-all ${
                                                    difficulty === key
                                                        ? `bg-gradient-to-r ${color} text-white shadow-lg scale-105`
                                                        : 'bg-white/20 text-white hover:bg-white/30'
                                                }`}
                                            >
                                                {t[key]} ({DIFFICULTY_SETTINGS[key].time}s)
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                
                                <button
                                    onClick={startRound}
                                    className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white text-xl font-bold py-4 px-8 rounded-2xl hover:from-pink-600 hover:to-purple-600 transition-all transform hover:scale-105 shadow-lg active:scale-95"
                                >
                                    {t.startGame}
                                </button>
                                
                                <div className="mt-8 text-purple-200 text-sm bg-white/5 rounded-2xl p-4">
                                    <h3 className="font-semibold mb-3 text-white">{t.howToPlay}</h3>
                                    <ol className="text-left space-y-2">
                                        <li className="flex items-start gap-2">
                                            <span className="bg-purple-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs flex-shrink-0 mt-0.5">1</span>
                                            <span>{t.step1}</span>
                                        </li>
                                        <li className="flex items-start gap-2">
                                            <span className="bg-purple-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs flex-shrink-0 mt-0.5">2</span>
                                            <span>{t.step2}</span>
                                        </li>
                                        <li className="flex items-start gap-2">
                                            <span className="bg-purple-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs flex-shrink-0 mt-0.5">3</span>
                                            <span>{t.step3}</span>
                                        </li>
                                        <li className="flex items-start gap-2">
                                            <span className="bg-purple-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs flex-shrink-0 mt-0.5">4</span>
                                            <span>{t.step4}</span>
                                        </li>
                                    </ol>
                                </div>

                                <p className="mt-4 text-purple-300/60 text-xs">
                                    {SONG_WORDS.length} {t.wordsAvailable}
                                </p>
                                
                                {/* Change language button */}
                                <button
                                    onClick={() => setLanguage(null)}
                                    className="mt-4 text-purple-300 hover:text-white text-sm transition-colors"
                                >
                                    {language === 'pt' ? '🇧🇷 Mudar idioma' : '🇺🇸 Change language'}
                                </button>
                            </div>
                        )}

                        {/* PLAYING */}
                        {gameState === 'playing' && (
                            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 text-center shadow-2xl border border-white/20">
                                {/* Timer Circle */}
                                <div className="relative w-48 h-48 mx-auto mb-6">
                                    <svg className="w-full h-full transform -rotate-90">
                                        <circle cx="96" cy="96" r="88" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="12" />
                                        <circle
                                            cx="96" cy="96" r="88" fill="none"
                                            stroke="url(#timerGradient)" strokeWidth="12" strokeLinecap="round"
                                            strokeDasharray={553}
                                            strokeDashoffset={553 - (timerProgress / 100) * 553}
                                            className="transition-all duration-1000 ease-linear"
                                        />
                                        <defs>
                                            <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                                <stop offset="0%" stopColor="#ec4899" />
                                                <stop offset="100%" stopColor="#8b5cf6" />
                                            </linearGradient>
                                        </defs>
                                    </svg>
                                    <div className="absolute inset-0 flex items-center justify-center">
                                        <span className={`text-6xl font-bold transition-colors ${getTimerColor()}`}>
                                            {timeLeft}
                                        </span>
                                    </div>
                                </div>

                                {/* Word Display */}
                                <div className="mb-8">
                                    <p className="text-purple-200 text-lg mb-2">{t.singASongWith}</p>
                                    <h2 className={`text-5xl font-bold text-white mb-4 ${showBounce ? 'bounce-in' : ''} ${isSpeaking ? 'word-glow' : ''}`}>
                                        "{currentWord}"
                                    </h2>
                                    <button
                                        onClick={() => speakWord(currentWord)}
                                        className="text-purple-300 hover:text-white transition-colors text-lg"
                                    >
                                        {t.hearAgain}
                                    </button>
                                </div>

                                {/* Buttons */}
                                <div className="flex gap-4">
                                    <button
                                        onClick={handleSkip}
                                        className="flex-1 bg-gradient-to-r from-red-500 to-orange-500 text-white py-4 px-6 rounded-2xl font-bold hover:from-red-600 hover:to-orange-600 transition-all active:scale-95 shadow-lg"
                                    >
                                        {t.skip}
                                    </button>
                                    <button
                                        onClick={handleCorrect}
                                        className="flex-1 bg-gradient-to-r from-green-500 to-emerald-500 text-white py-4 px-6 rounded-2xl font-bold hover:from-green-600 hover:to-emerald-600 transition-all active:scale-95 shadow-lg"
                                    >
                                        {t.gotIt}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* TIME'S UP */}
                        {gameState === 'timesup' && (
                            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 text-center shadow-2xl border border-white/20">
                                <div className="text-6xl mb-4 bounce-in">⏰</div>
                                <h2 className="text-3xl font-bold text-white mb-2">{t.timesUp}</h2>
                                <p className="text-purple-200 mb-2">{t.theWordWas}</p>
                                <h3 className="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400 mb-6">
                                    "{currentWord}"
                                </h3>

                                {/* Search for examples section */}
                                <p className="text-purple-200 text-sm mb-3">{t.findSongExample}</p>
                                <div className="flex gap-2 mb-4">
                                    <button
                                        onClick={openSpotifySearch}
                                        className="flex-1 bg-[#1DB954] text-white py-3 px-4 rounded-xl font-bold hover:bg-[#1ed760] transition-all flex items-center justify-center gap-2 active:scale-95 text-sm"
                                    >
                                        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                                        </svg>
                                        Spotify
                                    </button>
                                    <button
                                        onClick={openLyricsSearch}
                                        className="flex-1 bg-[#FFFF64] text-black py-3 px-4 rounded-xl font-bold hover:bg-[#ffff8a] transition-all flex items-center justify-center gap-2 active:scale-95 text-sm"
                                    >
                                        <span className="text-lg">📝</span>
                                        {language === 'pt' ? 'Letras' : 'Genius'}
                                    </button>
                                </div>

                                <div className="space-y-3">
                                    <button
                                        onClick={startRound}
                                        className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 px-6 rounded-2xl font-bold hover:from-pink-600 hover:to-purple-600 transition-all active:scale-95"
                                    >
                                        {t.nextWord}
                                    </button>

                                    <button
                                        onClick={resetGame}
                                        className="w-full bg-white/20 text-white py-3 px-6 rounded-2xl font-medium hover:bg-white/30 transition-all active:scale-95"
                                    >
                                        {t.backToMenu}
                                    </button>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SongWordGame />);
    </script>
</body>
</html>
